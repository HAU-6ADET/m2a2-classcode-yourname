name: Check M2A2

on:
  push:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'test/**'
      - 'student.json'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Blank code and identity fields are intentional in the public template.
    # Checks run on students' own private copies after they push their work.
    if: github.repository != 'HAU-6ADET/m2a2-classcode-yourname'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
